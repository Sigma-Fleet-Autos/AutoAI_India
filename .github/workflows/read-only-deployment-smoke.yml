name: Read-only deployment smoke

on:
  pull_request:
    paths:
      - 'scripts/verify_live_stack.py'
      - 'scripts/verify_independence.py'
      - 'scripts/tests/test_verify_live_stack.py'
      - 'scripts/tests/test_verify_independence.py'
      - '.github/workflows/read-only-deployment-smoke.yml'
  workflow_dispatch:
    inputs:
      frontend_origin:
        description: HTTPS frontend origin
        required: true
        default: https://autoaiindia.com
        type: string
      backend_origin:
        description: HTTPS backend origin
        required: true
        default: https://auto-ai-api.onrender.com
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Unit tests
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Tracked runtime independence audit
        run: python -m scripts.verify_independence
      - name: Read-only live checks
        if: github.event_name == 'workflow_dispatch'
        env:
          FRONTEND_ORIGIN: ${{ inputs.frontend_origin }}
          BACKEND_ORIGIN: ${{ inputs.backend_origin }}
        run: |
          python -m scripts.verify_live_stack --frontend "$FRONTEND_ORIGIN" --backend "$BACKEND_ORIGIN"
