<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoAI responsive QA</title><style>body{margin:0;background:#d9dadd;font:12px Arial}p{margin:10px}iframe{border:0;display:block;transform-origin:top left;margin:20px}</style></head><body><p id="context">Local UI fixture</p><iframe title="Responsive AutoAI preview"></iframe><script>
'use strict';
const params = new URLSearchParams(location.search);
const routes = new Map([['/','/'],['/cars','/cars'],['/showroom/ui-suv','/showroom/ui-suv'],['/configurator/ui-suv','/configurator/ui-suv'],['/emi','/emi'],['/compare','/compare'],['/recommend','/recommend'],['/news','/news'],['/about','/about'],['/dealers/apply','/dealers/apply'],['/login','/login'],['/premium','/premium']]);
const width = Math.max(320,Math.min(1920,Number(params.get('width'))||390));
const height = Math.max(600,Math.min(1200,Number(params.get('height'))||844));
const target = routes.get(params.get('path')) || '/';
const frame = document.querySelector('iframe');
frame.width = String(width); frame.height = String(height); frame.src = target;
document.querySelector('#context').textContent = `LOCAL UI FIXTURE · ${width} × ${height} CSS px · ${target}`;
function fit(){frame.style.transform = `scale(${Math.min(1,(innerWidth-40)/width)})`;}
fit(); addEventListener('resize',fit);
</script></body></html>
